[versions]
agp = "8.13.2"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"                  # fixed — must match your kotlin version
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.12.3"
composeBom = "2024.09.00"

# --- added ---
lifecycleViewmodelCompose = "2.10.0"
navigationCompose = "2.9.0"
hilt = "2.57.1"
hiltNavigationCompose = "1.2.0"
coroutines = "1.10.1"
